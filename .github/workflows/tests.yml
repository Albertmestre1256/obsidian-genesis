name: Pruebas

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.8", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Instalar pytest
        run: python -m pip install "pytest<9"
      - name: Correr las pruebas
        run: python -m pytest -v
      - name: El validador funciona sin dependencias sobre la célula de ejemplo
        run: python 00_CORE/schemas/validate.py
      - name: El índice distribuido está vigente
        run: python actualizar_indice.py --comprobar
      - name: Los rangos de las notas están vigentes
        run: python 00_CORE/schemas/note_index.py check --vault .
